<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172c28">
  <meta name="description" content="Tu horario de clases, a tu manera. Crea, adapta y lleva tus horarios contigo, también sin conexión.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mi horario</title>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al horario</a>
  <header class="topbar">
    <a href="./" class="brand" aria-label="Mi horario, inicio"><img src="./icons/icon.svg" alt="" width="40" height="40"><span>mi horario<span class="brand-dot">.</span></span></a>
    <div class="top-actions"><span id="connection" class="connection">En este dispositivo</span><button id="install" class="button small" hidden>Instalar app</button><button id="help" class="icon-button" aria-label="Ayuda e instalación" title="Ayuda e instalación">?</button><button id="theme" class="icon-button" aria-label="Cambiar tema" title="Cambiar tema">◐</button></div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="update" class="update-bar" hidden>Hay una nueva versión disponible. Tus horarios se conservarán. <button class="button small" id="apply-update">Actualizar</button></div>
  <main id="main" tabindex="-1"></main>
  <footer class="footer"><span>Hecho para que te centres en lo que toca.</span><span>Sin cuentas · Tus cambios se guardan aquí <button class="text-button" id="privacy">Cómo funciona</button></span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <noscript><p class="notice">Activa JavaScript para consultar y editar tus horarios.</p></noscript>
</body>
</html>
